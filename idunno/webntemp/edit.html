<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Редактировать трату</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<header>
		<h1>Мои траты</h1>
		<nav><a href="/">Главная</a></nav>
		<hr>
	</header>

	<main>
		<h2>Редактировать трату</h2>

		<form method="POST" action="/update">
			<input type="hidden" name="id" value="{{ .Expense.ID }}">

			<p>
				<label>Сумма:
					<input type="number" name="amount" step="0.01" value="{{ .Expense.Amount }}" required>
				</label>
			</p>
			<p>
				<label>Описание:
					<input type="text" name="description" value="{{ .Expense.Description }}" required>
				</label>
			</p>
			<p>
				<label>Дата:
					<input type="date" name="date" value="{{ .Expense.Date }}" required>
				</label>
			</p>

			<p>
				<label>Категория:
						<select name="category_id">
							{{ range .Categories }}
							<option value="{{ .ID }}" {{ if eq .ID $.Expense.CategoryID }}selected{{ end }}>
						{{ .Name }}
							</option>
						{{ end }}
						</select>
				</label>
			</p>

			<p>
				<button type="submit">Сохранить</button>
				<a href="/">Отмена</a>
			</p>
		</form>
	</main>

	<footer>
		<hr>
		<p><small>Проект на СЯП</small></p>
	</footer>
</body>
</html>
